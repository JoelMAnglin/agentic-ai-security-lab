[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-ai-security-lab"
version = "1.0.0"
description = "Beginner-friendly Ping-compatible agentic AI security lab"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "PyJWT[crypto]>=2.9,<3",
  "httpx>=0.27,<1",
  "PyYAML>=6,<7"
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.8,<1"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

